name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Reminder.xcodeproj \
            -scheme Reminder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 确认 String Catalog 编进了 App：缺了英文或繁体就让构建失败
      - name: Check localizations
        run: |
          app=build/Build/Products/Release-iphoneos/Reminder.app
          ls -d "$app"/*.lproj
          for lang in en zh-Hant; do
            ls "$app/$lang.lproj/" | grep -q '^Localizable' || { echo "missing $lang Localizable"; exit 1; }
            ls "$app/$lang.lproj/" | grep -q '^InfoPlist' || { echo "missing $lang InfoPlist"; exit 1; }
          done

      # 确认 Siri 触发语编进了 App：没有它们 Siri 根本认不出这个 App
      - name: Check Siri shortcuts
        run: |
          app=build/Build/Products/Release-iphoneos/Reminder.app
          ls -R "$app/Metadata.appintents" || { echo "missing Metadata.appintents"; exit 1; }
          grep -rq 'applicationName' "$app/Metadata.appintents" || { echo "no App Shortcut phrases in metadata"; exit 1; }
          for lang in zh-Hans zh-Hant; do
            ls "$app/$lang.lproj/" | grep -q '^AppShortcuts' || { echo "missing $lang AppShortcuts"; exit 1; }
          done

      # App Store 要求隐私清单，缺了上传会被拒
      - name: Check privacy manifest
        run: |
          ls build/Build/Products/Release-iphoneos/Reminder.app/PrivacyInfo.xcprivacy

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Reminder.app Payload/
          zip -qry Reminder-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Reminder-unsigned-ipa
          path: Reminder-unsigned.ipa
