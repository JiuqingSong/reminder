name: Reminder
options:
  bundleIdPrefix: com.songthin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Reminder:
    type: application
    platform: iOS
    sources:
      - Reminder
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songthin.willdo
        PRODUCT_NAME: Reminder
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 在 Mac 上用 Xcode 装机时，把这里改成你的 Personal Team ID（Xcode → Settings → Accounts 可查看）
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Reminder/Info.plist
      properties:
        CFBundleDisplayName: 不着急
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - zh-Hant
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于拍照并附加到提醒事项
        NSPhotoLibraryUsageDescription: 用于从相册选择图片附加到提醒事项
        NSLocationWhenInUseUsageDescription: 用于在地图上搜索购物地点，并在你到达开启了提醒的地点时，提醒你可以在那里买的物品
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # 只用系统自带的加密（HTTPS 等），上传 App Store 时不用再回答出口合规
        ITSAppUsesNonExemptEncryption: false
